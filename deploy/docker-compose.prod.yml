# ─────────────────────────────────────────────────────────────
# PRODUCTION stack behind nginx:
#   nginx  → frontend (Next.js) + api (FastAPI)
#   api / worker / beat  (share the report_storage volume)
#   db (Postgres) + redis
#
# Config sources:
#   - deploy/.env          → infra vars used by THIS file (Postgres creds, domain,
#                            frontend build args). Compose auto-loads deploy/.env.
#   - backend/.env         → the application's runtime config (all app settings).
#
# ⚠️  DATABASE_URL in backend/.env must point at host `db` and match the Postgres
#     credentials in deploy/.env. REDIS_URL must point at host `redis`.
#     See deploy/ENV_REFERENCE.md.
# ─────────────────────────────────────────────────────────────

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Not published to the host — only reachable inside the compose network.

  redis:
    image: redis:7
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../backend
    restart: unless-stopped
    env_file:
      - ../backend/.env
    volumes:
      - report_storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Run DB migrations on startup, then serve. (Phase 2+.)
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${API_WORKERS:-2}"

  worker:
    build:
      context: ../backend
    restart: unless-stopped
    env_file:
      - ../backend/.env
    volumes:
      - report_storage:/app/storage      # MUST be the same volume as api
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=INFO --concurrency=${CELERY_WORKER_CONCURRENCY:-4}

  beat:
    build:
      context: ../backend
    restart: unless-stopped
    env_file:
      - ../backend/.env
    depends_on:
      redis:
        condition: service_healthy
    # Exactly ONE beat instance (schedules retention in later phases).
    command: celery -A app.workers.celery_app.celery_app beat --loglevel=INFO

  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_MAX_RANGE_DAYS: ${NEXT_PUBLIC_MAX_RANGE_DAYS:-92}
        NEXT_PUBLIC_JOB_POLL_INTERVAL_MS: ${NEXT_PUBLIC_JOB_POLL_INTERVAL_MS:-3000}
        NEXT_PUBLIC_ENABLE_ASSISTANT: ${NEXT_PUBLIC_ENABLE_ASSISTANT:-false}
        NEXT_PUBLIC_IDLE_TIMEOUT_MIN: ${NEXT_PUBLIC_IDLE_TIMEOUT_MIN:-15}
    restart: unless-stopped
    depends_on:
      - api

  nginx:
    image: nginx:1.27
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # DEFAULT: plain HTTP over the server IP.
      - ./nginx/app.http-only.conf:/etc/nginx/conf.d/default.conf:ro
      # Optional self-signed TLS for the IP (see docs/deployment.md §6): comment the
      # line above and uncomment these two:
      # - ./nginx/app.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
      - frontend

volumes:
  db_data:
  report_storage:
