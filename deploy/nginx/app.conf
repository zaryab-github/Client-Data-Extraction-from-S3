# ─────────────────────────────────────────────────────────────
# OPTIONAL TLS reverse proxy (self-signed cert for the server IP).
# Default deployment uses app.http-only.conf (plain HTTP). Use this only if you want
# to encrypt traffic on the local network — see docs/deployment.md §6.
#
# Generate certs into deploy/nginx/certs/ (fullchain.pem, privkey.pem), replace
# <SERVER_IP> below, mount app.conf + the certs dir in docker-compose.prod.yml, and set
# NEXT_PUBLIC_API_BASE_URL / BACKEND_CORS_ORIGINS to https://<SERVER_IP>.
# ─────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name <SERVER_IP>;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name <SERVER_IP>;

    resolver 127.0.0.11 ipv6=off valid=10s;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 50m;
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ~ ^/(docs|redoc|openapi.json) {
        set $api_docs_upstream http://api:8000;
        proxy_pass $api_docs_upstream;
        proxy_set_header Host $host;
    }

    location / {
        set $frontend_upstream http://frontend:3000;
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
