# ─────────────────────────────────────────────────────────────
# nginx reverse proxy — for the DOCKERIZED nginx container.
# Upstreams use compose service names (api, frontend).
#
# Routing:
#   /            → frontend  (Next.js, :3000)
#   /api/        → backend   (FastAPI, :8000, serves /api/v1/...)
#   /docs,/openapi.json,/redoc → backend (optional; restrict/remove in prod)
#
# Replace `your-domain.com` below with your real domain (or the VM IP for
# internal-only HTTP). TLS certs are mounted at /etc/nginx/certs (see DEPLOYMENT.md).
# ─────────────────────────────────────────────────────────────

upstream backend_api {
    server api:8000;
}

upstream frontend_app {
    server frontend:3000;
}

# ---- HTTP: redirect to HTTPS (and serve ACME challenge for certbot) ----
server {
    listen 80;
    server_name your-domain.com;

    # Let's Encrypt HTTP-01 challenge (webroot).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else → HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS ----
server {
    listen 443 ssl;
    http2 on;
    server_name your-domain.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Report ZIP downloads can be large — allow big responses and long transfers.
    client_max_body_size 50m;
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    # ---- API ----
    location /api/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Support future SSE/WebSocket job-status streaming.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Large report downloads: stream instead of buffering to disk.
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- API docs (optional — comment out to disable in production) ----
    location ~ ^/(docs|redoc|openapi.json) {
        proxy_pass http://backend_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Frontend (Next.js) ----
    location / {
        proxy_pass http://frontend_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
