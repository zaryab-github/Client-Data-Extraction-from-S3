# ─────────────────────────────────────────────────────────────
# nginx reverse proxy — for the DOCKERIZED nginx container (TLS).
#
# Routing:
#   /            → frontend  (Next.js, :3000)
#   /api/        → backend   (FastAPI, :8000, serves /api/v1/...)
#   /docs,/openapi.json,/redoc → backend (optional; restrict/remove in prod)
#
# Replace `your-domain.com` (or use the VM IP) below. TLS certs are mounted at
# /etc/nginx/certs (see DEPLOYMENT.md — self-signed for an IP, or Let's Encrypt).
#
# Uses Docker's embedded DNS resolver + variables in proxy_pass so recreating the
# app containers does NOT require an nginx restart.
# ─────────────────────────────────────────────────────────────

# ---- HTTP: redirect to HTTPS (and serve ACME challenge for certbot) ----
server {
    listen 80;
    server_name your-domain.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS ----
server {
    listen 443 ssl;
    http2 on;
    server_name your-domain.com;

    resolver 127.0.0.11 ipv6=off valid=10s;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 50m;
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ~ ^/(docs|redoc|openapi.json) {
        set $api_docs_upstream http://api:8000;
        proxy_pass $api_docs_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        set $frontend_upstream http://frontend:3000;
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
