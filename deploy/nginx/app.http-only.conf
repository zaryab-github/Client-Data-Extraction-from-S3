# ─────────────────────────────────────────────────────────────
# HTTP-ONLY nginx config — for INITIAL testing or internal-VM deployments
# that do not (yet) have a public domain / TLS certificate.
#
# ⚠️  Do NOT use this for production over the public internet: traffic and JWTs
#     would be unencrypted. Use app.conf (TLS) once you have a domain + certs.
#
# To use this instead of app.conf, mount THIS file as default.conf in the nginx
# service (see the commented note in docker-compose.prod.yml).
# ─────────────────────────────────────────────────────────────

upstream backend_api {
    server api:8000;
}

upstream frontend_app {
    server frontend:3000;
}

server {
    listen 80;
    server_name _;          # matches any host / the VM IP

    client_max_body_size 50m;
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    location /api/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ~ ^/(docs|redoc|openapi.json) {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://frontend_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
