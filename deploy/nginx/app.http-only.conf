# ─────────────────────────────────────────────────────────────
# HTTP-ONLY nginx config — for INITIAL testing or internal-VM deployments
# that do not (yet) have a public domain / TLS certificate.
#
# ⚠️  Do NOT use this for production over the public internet: traffic and JWTs
#     would be unencrypted. Use app.conf (TLS) once you have a domain + certs.
#
# Uses Docker's embedded DNS resolver (127.0.0.11) + variables in proxy_pass so
# nginx RE-RESOLVES the api/frontend hostnames per request. This means recreating
# the app containers (which changes their IPs) does NOT require an nginx restart.
# ─────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name _;          # matches any host / the VM IP

    # Docker's embedded DNS. `valid=10s` re-checks the container IP periodically.
    resolver 127.0.0.11 ipv6=off valid=10s;

    client_max_body_size 50m;
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    location /api/ {
        # Variable forces runtime DNS resolution (not cached at startup).
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ~ ^/(docs|redoc|openapi.json) {
        set $api_docs_upstream http://api:8000;
        proxy_pass $api_docs_upstream;
        proxy_set_header Host $host;
    }

    location / {
        set $frontend_upstream http://frontend:3000;
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
