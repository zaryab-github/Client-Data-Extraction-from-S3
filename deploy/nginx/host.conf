# ─────────────────────────────────────────────────────────────
# Alternative: nginx installed DIRECTLY ON THE HOST (not in Docker).
# Use this if you run nginx as a system package on the VM and proxy to the
# app containers/processes on localhost.
#
# Install:  place at /etc/nginx/sites-available/extraction.conf
#           ln -s /etc/nginx/sites-available/extraction.conf \
#                 /etc/nginx/sites-enabled/extraction.conf
#           nginx -t && systemctl reload nginx
#
# Assumes api is published on 127.0.0.1:8000 and frontend on 127.0.0.1:3000
# (i.e. the compose services expose these ports on the host).
# For TLS, run: sudo certbot --nginx -d your-domain.com   (certbot edits this file).
# ─────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name your-domain.com;

    client_max_body_size 50m;
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ~ ^/(docs|redoc|openapi.json) {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
