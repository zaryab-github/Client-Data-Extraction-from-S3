[project]
name = "client-data-extraction-backend"
version = "0.1.0"
description = "Backend for the Client Data Extraction & Delivery System (FastAPI + Celery)"
requires-python = ">=3.11"

# NOTE: no secrets/URLs/credentials here — all runtime config comes from .env.
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "email-validator>=2.1",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "redis>=5.0",
    "celery>=5.3",
    "passlib[argon2]>=1.7.4",
    "pyjwt>=2.8",
    "boto3>=1.34",
    "requests>=2.31",
]

[project.optional-dependencies]
# Postgres driver — installed in real environments; tests use SQLite (stdlib).
postgres = ["psycopg[binary]>=3.1"]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "moto[s3]>=5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
